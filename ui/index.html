<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKP03 Deck</title>
<link rel="icon" href="/favicon.png">
<style>
@property --accent { syntax: '<color>'; inherits: true; initial-value: #7c5cff; }
:root{
  --accent:#7c5cff;
  --bg:#191b20; --panel:#202329; --panel2:#282b32; --line:#33373f;
  --text:#eceef2; --muted:#959cab; --danger:#ff6b6b;
  --display:"Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  transition: --accent .7s ease;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font:14px/1.5 var(--body); color:var(--text); background:var(--bg);
  display:grid; grid-template-rows:auto 1fr; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);background:#1c1e23}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:30px;height:30px}
.brand h1{font:600 20px/1 var(--display);margin:0;letter-spacing:.01em}
.status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}
.status b{width:9px;height:9px;border-radius:50%;background:#f5a524;box-shadow:0 0 0 4px rgba(245,165,36,.15)}
.status.on{color:var(--text)}
.status.on b{background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.15),0 0 12px #3ddc84}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 470px;min-height:0}
.stage{
  position:relative;display:flex;flex-direction:column;min-height:0;padding:22px 32px 26px;overflow:hidden;
  background:
    radial-gradient(55% 45% at 50% 62%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 72%),
    radial-gradient(120% 100% at 50% 40%, #22252c, #16181c 75%);
}

/* page strip */
.pages{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.pg{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:20px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);transition:background .25s,border-color .25s,color .25s}
.pg .em{font-size:18px;line-height:1}
.pg:hover{color:var(--text);border-color:#454a54}
.pg.on{color:#fff;border-color:var(--accent);background:color-mix(in srgb, var(--accent) 24%, transparent)}
.pg.add{border-style:dashed;padding:0 16px}

/* device */
.device-area{flex:1;display:grid;place-items:center;min-height:0}
.device-wrap{position:relative;isolation:isolate}
.device{
  position:absolute;left:0;top:0;width:660px;height:400px;transform-origin:0 0;border-radius:30px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
    linear-gradient(160deg,#2e3036 0%,#1d1f23 45%,#131417 100%);
  box-shadow:0 50px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 0 rgba(0,0,0,.4);
}
.device::before{content:"";position:absolute;left:10%;right:10%;bottom:-40px;height:80px;border-radius:50%;
  background:var(--accent);filter:blur(46px);opacity:.5;z-index:-1}
.engrave{position:absolute;top:20px;left:0;right:0;text-align:center;font:600 11px var(--display);letter-spacing:.35em;color:#5e636d}

.keys,.rbtns{position:absolute;left:62px;display:grid;grid-template-columns:repeat(3,100px);gap:16px}
.keys{top:58px}
.rbtns{top:296px;justify-items:center}

.key{position:relative;width:100px;height:100px;padding:7px;border-radius:15px;border:1px solid #2f3239;
  background:linear-gradient(180deg,#141518,#0b0c0e);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 16px rgba(0,0,0,.55)}
.lcd{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#000}
.lcd img{width:100%;height:100%;display:block}
.lcd::after{content:"";position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.16),transparent 38%);pointer-events:none}
.key.drag{outline:2px dashed var(--accent);outline-offset:4px}

.rbtn{position:relative;width:76px;height:76px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:radial-gradient(circle,#0c0d0f 58%,#26282d 61%,#151619 100%);box-shadow:inset 0 2px 5px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.05)}
.rbtn i{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#3b3d43,#16171a 72%);
  box-shadow:0 5px 9px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .12s}

.knob{position:absolute;border-radius:50%;border:0;padding:0;
  background:repeating-conic-gradient(#121316 0 3deg,#2d2f34 3deg 6deg);
  box-shadow:0 20px 34px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05)}
.knob.big{left:418px;top:56px;width:186px;height:186px}
.knob.small{top:278px;width:92px;height:92px}
.knob.k0{left:412px}.knob.k2{left:534px}
.cap{position:absolute;inset:8%;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.2),transparent 42%),
    conic-gradient(from 20deg,#2a2c31,#585b62,#25272b,#46494f,#2a2c31,#52555b,#2a2c31);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.14),inset 0 -8px 14px rgba(0,0,0,.5);
  transform:rotate(var(--rot,0deg));transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.cap::after{content:"";position:absolute;left:50%;top:6%;width:4px;height:17%;margin-left:-2px;border-radius:2px;
  background:var(--accent);box-shadow:0 0 10px var(--accent)}

.key,.rbtn,.knob{cursor:pointer;transition:outline-color .2s}
.sel{outline:3px solid var(--accent);outline-offset:5px}
.pulse.key .lcd{animation:press .35s ease}
.pulse.rbtn i{animation:pressb .3s ease}
.pulse.knob{animation:glow .45s ease}
@keyframes press{30%{transform:scale(.92);filter:brightness(1.5)}}
@keyframes pressb{30%{transform:scale(.88)}}
@keyframes glow{30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 45%,transparent),0 0 34px var(--accent)}}
.flip .lcd{animation:lcdin .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes lcdin{from{opacity:0;transform:scale(.8) rotateX(50deg)}}

[data-tip]:hover::before{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);
  white-space:nowrap;padding:5px 10px;border-radius:8px;background:#0d0e11;border:1px solid var(--line);color:var(--text);
  font:12px var(--body);z-index:5;pointer-events:none}

.ticker{display:flex;justify-content:center;gap:10px;align-items:baseline;min-height:24px;color:var(--muted);font-size:13px}
.ticker b{font:600 14px var(--display);color:var(--text)}
.ticker.ping b{color:var(--accent)}

/* ---------- inspector ---------- */
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:12px 18px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 14px 12px;border-bottom:2px solid transparent;font:600 14px var(--display)}
.tabs button.on{color:var(--text);border-color:var(--accent)}
#insp{flex:1;overflow:auto;padding:24px 26px 40px}
.head h2{font:600 26px/1.1 var(--display);margin:0}
.head p{margin:4px 0 0;color:var(--muted)}
.blk{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h3{font:600 15px var(--display);margin:0 0 10px}
.blk-h h3{margin:0}
h4{font:600 13px var(--body);margin:14px 0 8px;color:var(--text)}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.in{width:100%;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
.in:focus{outline:none;border-color:var(--accent)}
.in:disabled{opacity:.45}
select.in{padding-right:6px}
.in.big{width:76px;height:52px;font-size:28px;text-align:center;padding:0}
.f{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.f>span{font-size:13px;color:var(--muted)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:3px;cursor:pointer}
.sw{appearance:none;flex:none;width:44px;height:24px;border-radius:12px;background:#3a3e47;position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:var(--accent)}
.sw:checked::before{transform:translateX(20px)}

.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.btn:hover{border-color:#4a4f5a}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
.btn.danger{color:var(--danger)}
.seg{display:inline-flex;padding:3px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.seg button{border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:7px;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}

.hero{display:flex;gap:20px;margin-top:20px;align-items:flex-start}
.lcd-big{flex:none;width:164px;height:164px;padding:10px;border-radius:20px;background:#0b0c0e;border:1px solid #34373e;
  box-shadow:0 0 0 6px #17181c,0 18px 34px rgba(0,0,0,.45)}
.lcd-big img{width:100%;height:100%;border-radius:10px;display:block;background:#000}
.hero-f{flex:1;min-width:0}
.hero-f .f:first-child{margin-top:0}

.emoji-in{display:flex;align-items:center;gap:12px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;margin-top:12px}
.palette button{height:38px;border:1px solid transparent;border-radius:9px;background:none;font-size:20px}
.palette button:hover{background:var(--panel2);border-color:var(--line)}
.palette button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}

.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px;border:1.5px dashed #464b55;border-radius:14px;cursor:pointer;text-align:center;color:var(--muted)}
.drop b{color:var(--text);font-weight:600}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.filechip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--panel2);font-size:13px}
.filechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.act-line{display:grid;grid-template-columns:150px 1fr;gap:8px}
.act-tools{display:flex;gap:8px;margin-top:8px}
.act-tools .a-test{margin-left:auto}
.hint{margin:6px 0 0;font-size:12px;color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.presets button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);font-size:13px}
.presets button:hover{border-color:var(--accent)}

.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.sw-c{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw-c.on{border-color:#fff}

/* ---------- library ---------- */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,13,16,.6);backdrop-filter:blur(6px);z-index:20}
.modal[hidden]{display:none}
.sheet{width:min(900px,92vw);max-height:84vh;display:flex;flex-direction:column;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 40px 80px rgba(0,0,0,.6);animation:sheet .25s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{opacity:0;transform:translateY(14px) scale(.98)}}
.sheet header{background:none;border-bottom:1px solid var(--line);gap:16px;padding:18px 22px}
.sheet h2{font:600 22px var(--display);margin:0;flex:none}
.cats{display:flex;gap:6px;flex-wrap:wrap;padding:14px 22px 0}
.cats button{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:none;color:var(--muted);font-size:13px}
.cats button.on{color:#fff;background:var(--accent);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:16px 22px 22px;overflow:auto}
.li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left}
.li:hover{border-color:var(--accent);transform:translateY(-1px)}
.li .e{flex:none;width:46px;height:46px;border-radius:11px;background:#000;display:grid;place-items:center;font-size:26px}
.li b{display:block;font-weight:600}
.li small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}

#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{padding:10px 16px;border-radius:12px;background:#0f1013;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5);animation:sheet .2s ease}
.toast.err{border-color:var(--danger)}

/* ---------- v4 ---------- */
@keyframes rgb{0%{--accent:#ff3b6b}20%{--accent:#ffb020}40%{--accent:#2ee59d}60%{--accent:#22d3ee}80%{--accent:#a855f7}100%{--accent:#ff3b6b}}
html.rgb{animation:rgb 9s linear infinite}
.device{-webkit-box-reflect:below 16px linear-gradient(transparent 64%, rgba(255,255,255,.16))}
.key{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 16px rgba(0,0,0,.55),0 0 30px -4px var(--glow,transparent);transition:box-shadow .4s}
.brand{cursor:pointer}
.brand .by{display:block;font:500 12px var(--body);color:var(--muted);margin-top:3px}
.brand h1{line-height:1}
.boot .device-wrap{animation:devin 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes devin{from{opacity:0;transform:translateY(34px)}}
.boot .lcd{animation:poweron .6s ease both;animation-delay:calc(.55s + var(--d,0ms))}
@keyframes poweron{0%{opacity:0;filter:brightness(3) saturate(0)}55%{opacity:1;filter:brightness(1.7)}100%{filter:none}}
.boot .cap{animation:knobin 1.3s cubic-bezier(.2,.8,.2,1) .25s both}
@keyframes knobin{from{transform:rotate(-220deg)}}
.boot .pages,.boot .side{animation:fadein .7s ease .9s both}
@keyframes fadein{from{opacity:0}}
.ticker{position:relative;z-index:2}
.vitals{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 12px}
.vitals:empty{display:none}
.vital{display:flex;gap:8px;align-items:baseline;padding:6px 14px;border-radius:999px;background:rgba(20,22,27,.7);border:1px solid var(--line);backdrop-filter:blur(8px)}
.vital b{font:600 16px var(--display);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.vital span{color:var(--muted);font-size:12px}
.sig{position:absolute;right:28px;bottom:16px;z-index:2;text-align:right;color:var(--muted);font-size:12px;cursor:pointer;background:none;border:0;padding:0}
.sig b{display:block;font:700 13px var(--display);letter-spacing:.32em;color:var(--text);opacity:.85}
.sig:hover b{color:var(--accent);opacity:1}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left}
.metric small{color:var(--muted);font-size:12px}
.metric small.ok{color:#3ddc84}
.metric.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel2))}
.helper{margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 8%,transparent)}
.helper p{margin:0 0 10px;color:var(--text);font-size:13px}
.about{width:min(460px,92vw);padding:34px 30px 26px;text-align:center}
.halo{position:relative;width:132px;height:132px;margin:0 auto 18px;display:grid;place-items:center}
.halo::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ff3b6b,#ffb020,#2ee59d,#22d3ee,#a855f7,#ff3b6b);filter:blur(10px);opacity:.85;animation:spin 6s linear infinite}
.halo::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel)}
.halo img{position:relative;z-index:1;width:74px;height:74px}
@keyframes spin{to{transform:rotate(360deg)}}
.about h2{font:700 30px var(--display);margin:0}
.about .ver{color:var(--muted);margin:4px 0 22px}
.about .who{font:600 18px var(--display);margin:0}
.about .studio{font:700 15px var(--display);letter-spacing:.4em;margin:8px 0 22px;color:var(--accent)}
.about .thanks{color:var(--muted);font-size:12.5px;line-height:1.6;margin:0 0 20px}
.about .btn{align-self:center;min-width:140px}
.about .thanks a{color:var(--text);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}


/* ---------- v5 ---------- */
.stagebar{position:absolute;right:28px;top:22px;z-index:3;display:flex;gap:8px}
.chipbtn{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:rgba(20,22,27,.7);color:var(--muted);font-size:13px;backdrop-filter:blur(8px)}
.chipbtn.on{color:#fff;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 24%,transparent)}
.pages{margin-right:120px}
.pg .auto{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 6px;margin-left:2px}
.heat .key .lcd::before{content:attr(data-n);position:absolute;inset:0;z-index:2;display:grid;place-items:center;font:700 26px var(--display);color:#fff;
  background:var(--heat);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.heat .rbtn::after,.heat .knob::after{content:attr(data-n);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  min-width:34px;padding:2px 8px;border-radius:12px;background:var(--heat);font:700 14px var(--display);color:#fff}
.hud{position:absolute;left:50%;top:84px;transform:translateX(-50%) translateY(-8px);z-index:4;display:flex;align-items:center;gap:14px;
  padding:10px 18px 10px 10px;border-radius:18px;background:rgba(16,17,21,.86);border:1px solid var(--line);backdrop-filter:blur(12px);
  box-shadow:0 20px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.hud.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hud img{width:44px;height:44px}
.hud b{display:block;font:600 15px var(--display)}
.hud .bar{width:180px;height:8px;border-radius:4px;background:#2b2f39;margin-top:6px;overflow:hidden}
.hud .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .12s}
.hud small{color:var(--muted);font:600 13px var(--display);margin-left:auto;padding-left:10px}
.gamebar{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:4;display:flex;gap:12px;align-items:center;padding:8px 8px 8px 16px;border-radius:16px;background:rgba(16,17,21,.86);border:1px solid var(--accent)}
.gamebar[hidden]{display:none}
.gal-top{display:flex;gap:8px;align-items:center}
.gal-cats{display:flex;gap:6px;overflow-x:auto;margin:10px 0 8px;padding-bottom:4px;scrollbar-width:thin}
.gal-cats button{flex:none;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--muted);font-size:12px}
.gal-cats button.on{background:var(--accent);border-color:transparent;color:#fff}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.gallery button{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:#0c0d10;padding:6px;display:grid;place-items:center}
.gallery button:hover{border-color:var(--line);background:#14161b}
.gallery button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.gallery img{width:100%;height:100%;object-fit:contain}
.gallery button.remote{opacity:.85}
.gest{display:flex;gap:6px;margin-bottom:12px}
.gest button{position:relative;flex:1;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font:600 13px var(--display)}
.gest button.on{color:#fff;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel2))}
.gest button.set::after{content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.step{display:grid;grid-template-columns:22px 130px 1fr 32px;gap:6px;align-items:center}
.step .n{color:var(--muted);font:600 12px var(--display);text-align:center}
.step .x{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
textarea.in{height:76px;padding:10px 12px;resize:vertical;line-height:1.4}
.modechips{display:flex;flex-wrap:wrap;gap:6px}
.modechips button{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--panel2);font-size:13px;color:var(--muted)}
.modechips button.on{color:#fff;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel2))}
.modechips button .o{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:6px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px}
.applist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.applist button{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);background:var(--panel2);font-size:12px}
.applist button.rm::after{content:" ✕";color:var(--muted)}
.stat-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat-top div{padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.stat-top b{display:block;font:700 26px var(--display);font-variant-numeric:tabular-nums}
.stat-top span{color:var(--muted);font-size:12px}
.rank{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.rank div{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:8px 12px 8px 8px;border-radius:12px;background:var(--panel2)}
.rank img{width:36px;height:36px;border-radius:8px;background:#000;object-fit:contain}
.rank i{height:6px;border-radius:3px;background:var(--accent);display:block;margin-top:4px}
.rank small{color:var(--muted)}
.toast.big{max-width:420px;white-space:pre-wrap;line-height:1.45}
.toast b{display:block;margin-bottom:4px;color:var(--accent);font-family:var(--display)}

/* ---------- v6 ---------- */
.status{cursor:pointer;padding:6px 12px;border-radius:999px;border:1px solid transparent;transition:border-color .2s}
.status:hover{border-color:var(--line)}
.status.warn b{background:#f5a524;animation:blink 1s ease infinite}
@keyframes blink{50%{opacity:.35}}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font:600 11px var(--body);color:var(--muted)}
.hdr-right{display:flex;align-items:center;gap:12px}
.cmdbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:13px}
.cmdbtn:hover{border-color:#4a4f5a;color:var(--text)}
.palette-modal .sheet{width:min(620px,92vw);max-height:70vh}
.pal-in{border:0;background:none;height:56px;padding:0 22px;font-size:17px;color:var(--text);width:100%;outline:none;border-bottom:1px solid var(--line)}
.pal-list{overflow:auto;padding:8px}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border:0;border-radius:10px;background:none;text-align:left}
.pal-item img{width:30px;height:30px;object-fit:contain}
.pal-item .em{width:30px;text-align:center;font-size:20px}
.pal-item small{margin-left:auto;color:var(--muted);font-size:12px}
.pal-item.on{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.health{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
.health div{padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.health b{display:block;font:700 18px var(--display);font-variant-numeric:tabular-nums}
.health span{color:var(--muted);font-size:12px}

@media (max-width:1100px){main{grid-template-columns:1fr 400px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand" id="brand" title="About"><img src="/favicon.png" alt=""><div><h1>AKP03 Deck</h1><span class="by" id="byline"></span></div></div>
  <div class="hdr-right">
    <button class="cmdbtn" id="cmdBtn">Search everything <span class="kbd">Ctrl K</span></button>
    <div class="status" id="status" title="Click to reconnect"><b></b><span>Looking for your deck</span></div>
  </div>
</header>

<main>
  <section class="stage">
    <nav class="pages" id="pages" aria-label="Pages"></nav>
    <div class="stagebar"><button class="chipbtn" id="heatBtn">Heatmap</button></div>
    <div class="hud" id="hud"><img alt=""><div><b></b><div class="bar"><i></i></div></div><small></small></div>
    <div class="gamebar" id="gamebar" hidden><span id="gameTxt"></span><button class="btn" id="quitGame">Quit game</button></div>
    <div class="device-area" id="area">
      <div class="device-wrap" id="wrap">
        <div class="device" id="device">
          <div class="engrave">AKP03E</div>
          <div class="keys" id="keys">
            <button class="key" data-i="0"><div class="lcd"><img alt=""></div></button>
            <button class="key" data-i="1"><div class="lcd"><img alt=""></div></button>
            <button class="key" data-i="2"><div class="lcd"><img alt=""></div></button>
            <button class="key" data-i="3"><div class="lcd"><img alt=""></div></button>
            <button class="key" data-i="4"><div class="lcd"><img alt=""></div></button>
            <button class="key" data-i="5"><div class="lcd"><img alt=""></div></button>
          </div>
          <div class="rbtns">
            <button class="rbtn" data-i="0"><i></i></button>
            <button class="rbtn" data-i="1"><i></i></button>
            <button class="rbtn" data-i="2"><i></i></button>
          </div>
          <button class="knob big" data-k="1"><span class="cap"></span></button>
          <button class="knob small k0" data-k="0"><span class="cap"></span></button>
          <button class="knob small k2" data-k="2"><span class="cap"></span></button>
        </div>
      </div>
    </div>
    <div class="vitals" id="vitals"></div>
    <div class="ticker" id="ticker"><span>Press a key or turn a knob on your deck</span></div>
    <button class="sig" id="sig"><b id="sigStudio"></b><span id="sigWho"></span></button>
  </section>

  <aside class="side">
    <nav class="tabs" id="tabs">
      <button data-tab="edit" class="on">Edit</button>
      <button data-tab="page">Page</button>
      <button data-tab="stats">Stats</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div id="insp"></div>
  </aside>
</main>

<div class="modal" id="lib" hidden>
  <div class="sheet" role="dialog" aria-label="Library">
    <header><h2>Library</h2><input class="in" id="libSearch" placeholder="Search apps and actions"><button class="btn" id="libClose">Close</button></header>
    <div class="cats" id="libCats"></div>
    <div class="grid" id="libGrid"></div>
  </div>
</div>
<div class="modal" id="about" hidden>
  <div class="sheet about" role="dialog" aria-label="About">
    <div class="halo"><img src="/favicon.png" alt=""></div>
    <h2>AKP03 Deck</h2>
    <p class="ver" id="aVer"></p>
    <p class="who" id="aWho"></p>
    <p class="studio" id="aStudio"></p>
    <p class="thanks">Talks to the deck thanks to open source work from
      <a data-u="https://github.com/4ndv/mirajazz">mirajazz</a>, <a data-u="https://pypi.org/project/soomfon/">soomfon</a> and
      <a data-u="https://github.com/sepivip/codexdeck">codexdeck</a>. Temperatures from
      <a data-u="https://github.com/LibreHardwareMonitor/LibreHardwareMonitor">LibreHardwareMonitor</a>.</p>
    <button class="btn primary" id="aClose">Close</button>
  </div>
</div>
<div class="modal palette-modal" id="pal" hidden>
  <div class="sheet" role="dialog" aria-label="Search">
    <input class="pal-in" id="palIn" placeholder="Jump to a page, key, setting or action" autocomplete="off">
    <div class="pal-list" id="palList"></div>
  </div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toasts"></div>

<script src="/ui.js"></script>
</body>
</html>
