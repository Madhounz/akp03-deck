name: New device
description: Help add support for another AKP03 or Mirabox variant
labels: [device]
body:
  - type: input
    id: name
    attributes:
      label: Device name
    validations:
      required: true
  - type: textarea
    id: list
    attributes:
      label: Output of `python app.py --list`
      render: text
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: What works and what does not?
